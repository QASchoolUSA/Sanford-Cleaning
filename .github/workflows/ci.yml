name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

  deploy_preview_and_test:
    needs: build_and_checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel preview env
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel pull --yes --environment=preview --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Clean previous build output (preview)
        run: rm -rf .vercel/output

      - name: Build with Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel build --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy preview from prebuilt
        id: deploy_preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          PREVIEW_URL=$(pnpm dlx vercel deploy --prebuilt --token "${{ secrets.VERCEL_TOKEN }}")
          PREVIEW_URL=$(echo "$PREVIEW_URL" | tr -d '\n' | xargs)
          if [ -z "$PREVIEW_URL" ]; then
            echo "Preview URL is empty. Deployment may have failed or URL was not captured." >&2
            exit 1
          fi
          if ! echo "$PREVIEW_URL" | grep -qE '^https://'; then
            echo "Unexpected deploy output (not a URL): $PREVIEW_URL" >&2
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Wait for preview to be reachable
        run: |
          PREVIEW_URL="${{ steps.deploy_preview.outputs.preview_url }}"
          echo "Preview: $PREVIEW_URL"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Preview URL is empty. Deployment may have failed or URL was not captured." >&2
            exit 1
          fi
          for i in {1..30}; do
            if curl -sSf "$PREVIEW_URL" >/dev/null; then
              echo "Preview is live"
              exit 0
            fi
            echo "Waiting for preview..."
            sleep 5
          done
          echo "Preview did not become reachable in time" >&2
          exit 1

      - name: Run link checks against preview
        env:
          BASE_URL: ${{ steps.deploy_preview.outputs.preview_url }}
        run: pnpm run test:links

  deploy_production:
    if: github.ref == 'refs/heads/main'
    needs: deploy_preview_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel production env
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Clean previous build output (production)
        run: rm -rf .vercel/output

      - name: Build with Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel build --prod --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production from prebuilt
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
